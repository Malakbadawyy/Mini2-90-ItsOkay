services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: itsOkay
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "9000:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/itsOkay?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  postgres:
    image: postgres
    container_name: postgres_itsOkay
    environment:
      POSTGRES_DB: itsOkay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: itsOkay
    depends_on:
      - postgres
      - mongo
    ports:
      - "8080:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/itsOkay
      spring.data.mongodb.uri: mongodb://root:example@mongo:27017/itsOkay?authSource=admin
      spring.datasource.username: postgres
      spring.datasource.password: 1234
